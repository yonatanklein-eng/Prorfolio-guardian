# Pulls market data once a day and commits it into the repo.
#
# The point is that this runs server-side. In the browser the app is subject
# to CORS on every request and none of the free providers reliably allow it;
# here there is no CORS, no subrequest cap, and no API key to expose. The page
# then reads data/market.json from its own origin, which cannot be broken by
# somebody else's CORS policy.
name: Collect market data

on:
  schedule:
    # Three times on weekdays. Breadth prices every stock in the index on each
    # run; the 200-day averages it compares them with are refreshed on a
    # rotation that fits Twelve Data's daily credits, a slice per run.
    - cron: '0 14 * * 1-5'   # US pre-open
    - cron: '0 18 * * 1-5'   # midday
    - cron: '0 22 * * 1-5'   # after the close, once prices have settled
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# One collection at a time. Every run reads data/market.json at its start and
# writes it at its end, so two overlapping runs would each build on a snapshot
# the other is about to replace, and the second push could not be rebased.
# A run started while one is going waits for it instead.
concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect market data
        # Yahoo answers 429 to this runner on the first request (see
        # scripts/probe.mjs), so FRED carries the history and macro series.
        # Without the secret the collector still runs — it just has no upstream
        # left for those, and fails loudly rather than committing a blank file.
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Breadth needs both: Finnhub prices all ~500 today, Twelve Data
          # refreshes their 200-day averages within the daily credit budget.
          # Missing either just means breadth stays unavailable.
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: node scripts/fetch-market.mjs
        # Pacing to stay under 8 credits/min means a full refresh takes a while.
        timeout-minutes: 90

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          if git diff --staged --quiet; then
            echo "data unchanged — nothing to commit"
          else
            git commit -m "Update market data ($(date -u +%Y-%m-%d))"
            # A run with breadth refreshes can take half an hour, and main may
            # move in the meantime. A bare push would then be rejected and the
            # whole run's collection lost. This job only ever writes
            # data/market.json, and runs never overlap (see concurrency), so
            # rebasing onto whatever landed cannot conflict.
            pushed=
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "push attempt $attempt failed, retrying"
              sleep 5
            done
            # Say so if it never landed, rather than finish green with nothing saved.
            [ -n "$pushed" ] || { echo "::error::could not push market data"; exit 1; }
          fi

  # A push made with GITHUB_TOKEN does not trigger other workflows, so the
  # Pages deploy has to be driven from here rather than left to static.yml.
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # pick up the commit the collect job just pushed
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
